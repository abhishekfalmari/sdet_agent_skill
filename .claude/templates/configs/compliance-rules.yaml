# FDA 21 CFR Part 11 Compliance
fda_21cfr11:
  enabled: true
  description: "FDA 21 CFR Part 11 - Electronic Records/Signatures"
  requirements:
    - id: "11.10"
      title: "Controls for closed systems"
      tests:
        - "Verify system validation"
        - "Verify audit trail"
        - "Verify record retention"
        - "Verify access controls"
        - "Verify device checks"
        - "Verify training"
      evidence:
        - "Validation protocols/reports"
        - "Audit trail samples"
        - "Retention policies"
        - "Access control matrix"
        - "Device check procedures"
        - "Training records"

    - id: "11.30"
      title: "Controls for open systems"
      tests:
        - "Verify document encryption"
        - "Verify digital signatures"
      evidence:
        - "Encryption implementation"
        - "Digital signature procedures"

    - id: "11.50"
      title: "Signature manifestations"
      tests:
        - "Verify printed name"
        - "Verify date/time"
        - "Verify meaning"
      evidence:
        - "Signature samples"
        - "Signature policy"

    - id: "11.70"
      title: "Signature/record linking"
      tests:
        - "Verify signature cannot be falsified"
        - "Verify signature linked to record"
      evidence:
        - "Linking mechanism"
        - "Tamper evidence"

    - id: "11.100"
      title: "General requirements for electronic signatures"
      tests:
        - "Verify unique signature"
        - "Verify identity verification"
        - "Verify non-repudiation"
      evidence:
        - "Signature procedures"
        - "Identity verification"
        - "Non-repudiation evidence"

    - id: "11.200"
      title: "Electronic signature components/controls"
      tests:
        - "Verify biometric/password controls"
        - "Verify token/password controls"
        - "Verify signature verification"
      evidence:
        - "Signature component configs"
        - "Verification procedures"

    - id: "11.300"
      title: "Controls for identification codes/passwords"
      tests:
        - "Verify uniqueness"
        - "Verify periodic changes"
        - "Verify loss management"
        - "Verify detection"
      evidence:
        - "Password policies"
        - "Change logs"
        - "Loss procedures"
        - "Detection mechanisms"

  evidencePackage:
    required:
      - "Validation documentation"
      - "Audit trail procedures"
      - "Access control procedures"
      - "Signature policies"
      - "Training records"
      - "System documentation"
      - "Incident/deviation records"
      - "Periodic review records"

