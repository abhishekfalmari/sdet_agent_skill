# Compliance Rules Configuration
# Used by sdet-compliance, sdet-audit, sdet-governance
# Place at: templates/configs/compliance-rules.yaml

version: "1.0"
description: "Regulatory compliance testing rules and evidence requirements"

# Global Settings
global:
  evidenceRetentionDays: 2555  # 7 years
  evidenceFormat: "pdf"  # pdf, html, json, zip
  evidenceEncryption: true
  evidenceSigning: true
  autoPackage: true
  packageOnSchedule: "0 2 1 * *"  # Monthly 1st at 2 AM

# GDPR Compliance (General Data Protection Regulation)
gdpr:
  enabled: true
  description: "EU General Data Protection Regulation"
  articles:
    - article: "Article 5"
      title: "Principles relating to processing of personal data"
      requirements:
        - id: "gdpr-5-1-a"
          title: "Lawfulness, fairness and transparency"
          testable: true
          tests:
            - "Verify privacy notice accessible"
            - "Verify lawful basis documented"
            - "Verify processing purpose specified"
          evidence:
            - "Privacy notice URL"
            - "Lawful basis register"
            - "Processing register"

        - id: "gdpr-5-1-b"
          title: "Purpose limitation"
          testable: true
          tests:
            - "Verify data not used beyond stated purpose"
            - "Verify purpose compatibility assessment"
          evidence:
            - "Processing register"
            - "DPIA records"

        - id: "gdpr-5-1-c"
          title: "Data minimisation"
          testable: true
          tests:
            - "Verify only necessary data collected"
            - "Verify data retention policies"
          evidence:
            - "Data inventory"
            - "Retention schedule"

        - id: "gdpr-5-1-d"
          title: "Accuracy"
          testable: true
          tests:
            - "Verify data correction process"
            - "Verify accuracy checks"
          evidence:
            - "Correction procedures"
            - "Audit logs"

        - id: "gdpr-5-1-e"
          title: "Storage limitation"
          testable: true
          tests:
            - "Verify automated deletion"
            - "Verify retention schedule enforcement"
          evidence:
            - "Retention schedule"
            - "Deletion logs"

        - id: "gdpr-5-1-f"
          title: "Integrity and confidentiality"
          testable: true
          tests:
            - "Verify encryption at rest"
            - "Verify encryption in transit"
            - "Verify access controls"
            - "Verify security testing"
          evidence:
            - "Encryption certificates"
            - "Access control matrix"
            - "Security test reports"

    - article: "Article 6"
      title: "Lawfulness of processing"
      requirements:
        - id: "gdpr-6"
          title: "Lawful basis for processing"
          testable: true
          tests:
            - "Verify consent mechanism"
            - "Verify contract necessity"
            - "Verify legitimate interest assessment"
          evidence:
            - "Consent records"
            - "Contracts"
            - "LIA records"

    - article: "Article 7"
      title: "Conditions for consent"
      requirements:
        - id: "gdpr-7"
          title: "Valid consent"
          testable: true
          tests:
            - "Verify granular consent"
            - "Verify withdrawable consent"
            - "Verify consent records"
          evidence:
            - "Consent UI screenshots"
            - "Consent withdrawal logs"
            - "Consent database"

    - article: "Article 12-22"
      title: "Data Subject Rights"
      requirements:
        - id: "gdpr-15"
          title: "Right of access"
          testable: true
          tests:
            - "Verify DSAR process"
            - "Verify 30-day response"
            - "Verify complete data export"
          evidence:
            - "DSAR procedure"
            - "Response time logs"
            - "Export samples"

        - id: "gdpr-16"
          title: "Right to rectification"
          testable: true
          tests:
            - "Verify correction process"
            - "Verify downstream propagation"
          evidence:
            - "Correction procedure"
            - "Propagation logs"

        - id: "gdpr-17"
          title: "Right to erasure (Right to be forgotten)"
          testable: true
          tests:
            - "Verify deletion process"
            - "Verify backup handling"
            - "Verify third-party notification"
          evidence:
            - "Deletion procedure"
            - "Backup retention policy"
            - "Third-party contracts"

        - id: "gdpr-18"
          title: "Right to restriction of processing"
          testable: true
          tests:
            - "Verify restriction flag"
            - "Verify processing halt"
          evidence:
            - "Restriction procedures"
            - "System flags"

        - id: "gdpr-20"
          title: "Right to data portability"
          testable: true
          tests:
            - "Verify machine-readable export"
            - "Verify direct transmission"
          evidence:
            - "Export format specs"
            - "Transmission logs"

        - id: "gdpr-21"
          title: "Right to object"
          testable: true
          tests:
            - "Verify objection process"
            - "Verify marketing opt-out"
          evidence:
            - "Objection procedure"
            - "Opt-out logs"

    - article: "Article 25"
      title: "Data protection by design and by default"
      requirements:
        - id: "gdpr-25"
          title: "Privacy by design/default"
          testable: true
          tests:
            - "Verify privacy impact assessments"
            - "Verify default settings privacy-friendly"
            - "Verify pseudonymization"
          evidence:
            - "DPIA reports"
            - "Default config review"
            - "Pseudonymization implementation"

    - article: "Article 30"
      title: "Records of processing activities"
      requirements:
        - id: "gdpr-30"
          title: "Processing register"
          testable: true
          tests:
            - "Verify register completeness"
            - "Verify register accuracy"
          evidence:
            - "Processing register"
            - "Review logs"

    - article: "Article 32"
      title: "Security of processing"
      requirements:
        - id: "gdpr-32"
          title: "Technical and organisational measures"
          testable: true
          tests:
            - "Verify encryption"
            - "Verify access controls"
            - "Verify resilience"
            - "Verify regular testing"
          evidence:
            - "Security architecture"
            - "Penetration test reports"
            - "Incident response plan"

    - article: "Article 33-34"
      title: "Notification of personal data breach"
      requirements:
        - id: "gdpr-33-34"
          title: "Breach notification"
          testable: true
          tests:
            - "Verify 72-hour notification process"
            - "Verify data subject notification"
            - "Verify breach register"
          evidence:
            - "Breach response plan"
            - "Notification templates"
            - "Breach register"

    - article: "Article 35"
      title: "Data protection impact assessment"
      requirements:
        - id: "gdpr-35"
          title: "DPIA for high-risk processing"
          testable: true
          tests:
            - "Verify DPIA completed"
            - "Verify DPIA reviewed"
          evidence:
            - "DPIA reports"
            - "Review approvals"

    - article: "Article 28"
      title: "Processor obligations"
      requirements:
        - id: "gdpr-28"
          title: "Data processing agreements"
          testable: true
          tests:
            - "Verify DPA with all processors"
            - "Verify DPA terms"
          evidence:
            - "DPA contracts"
            - "Processor list"

  evidencePackage:
    required:
      - "Privacy notices"
      - "Processing register (Article 30)"
      - "DPIA reports (Article 35)"
      - "DPA contracts (Article 28)"
      - "Security measures documentation (Article 32)"
      - "Breach response plan (Articles 33-34)"
      - "DSAR procedures (Articles 12-22)"
      - "Consent records (Article 7)"
      - "Retention schedules (Article 5)"
      - "Training records"
    optional:
      - "Certifications (ISO 27001, SOC 2)"
      - "Third-party audit reports"
      - "DPIA methodology"

# HIPAA Compliance (Health Insurance Portability and Accountability Act)
hipaa:
  enabled: true
  description: "US Health Insurance Portability and Accountability Act"
  rules:
    privacyRule:
      - id: "hipaa-164-502"
        title: "Uses and disclosures of PHI"
        testable: true
        tests:
          - "Verify minimum necessary standard"
          - "Verify authorization for non-TPO uses"
        evidence:
          - "Authorization forms"
          - "Minimum necessary procedures"

      - id: "hipaa-164-508"
        title: "Uses and disclosures requiring opportunity to agree or object"
        testable: true
        tests:
          - "Verify directory opt-out"
          - "Verify family notification procedures"
        evidence:
          - "Directory procedures"
          - "Notification logs"

      - id: "hipaa-164-510"
        title: "Uses and disclosures for public policy"
        testable: true
        tests:
          - "Verify required-by-law disclosures"
          - "Verify public health reporting"
        evidence:
          - "Legal disclosure procedures"
          - "Reporting logs"

      - id: "hipaa-164-512"
        title: "Uses and disclosures requiring authorization"
        testable: true
        tests:
          - "Verify psychotherapy notes protection"
          - "Verify marketing authorization"
        evidence:
          - "Authorization forms"
          - "Marketing opt-in logs"

      - id: "hipaa-164-514"
        title: "Minimum necessary requirements"
        testable: true
        tests:
          - "Verify access controls by role"
          - "Verify routine disclosures limited"
        evidence:
          - "Role-based access matrix"
          - "Disclosure logs"

      - id: "hipaa-164-520"
        title: "Notice of privacy practices"
        testable: true
        tests:
          - "Verify notice content"
          - "Verify notice distribution"
          - "Verify acknowledgment"
        evidence:
          - "Notice document"
          - "Distribution logs"
          - "Acknowledgment records"

      - id: "hipaa-164-524"
        title: "Right to access PHI"
        testable: true
        tests:
          - "Verify access request process"
          - "Verify 30-day response"
          - "Verify format options"
        evidence:
          - "Access procedures"
          - "Response time logs"
          - "Format samples"

      - id: "hipaa-164-526"
        title: "Right to amend PHI"
        testable: true
        tests:
          - "Verify amendment process"
          - "Verify denial procedures"
        evidence:
          - "Amendment procedures"
          - "Denial logs"

      - id: "hipaa-164-528"
        title: "Accounting of disclosures"
        testable: true
        tests:
          - "Verify disclosure tracking"
          - "Verify accounting availability"
        evidence:
          - "Disclosure logs"
          - "Accounting samples"

      - id: "hipaa-164-530"
        title: "Restrictions and confidential communications"
        testable: true
        tests:
          - "Verify restriction requests"
          - "Verify confidential communications"
        evidence:
          - "Restriction procedures"
          - "Communication logs"

    securityRule:
      administrative:
        - id: "hipaa-164-308-a-1"
          title: "Security officer assigned"
          testable: true
          tests:
            - "Verify security officer designated"
            - "Verify responsibilities documented"
          evidence:
            - "Security officer appointment"
            - "Role description"

        - id: "hipaa-164-308-a-2"
          title: "Workforce security"
          testable: true
          tests:
            - "Verify authorization/supervision"
            - "Verify termination procedures"
          evidence:
            - "Authorization procedures"
            - "Termination checklists"

        - id: "hipaa-164-308-a-3"
          title: "Information access management"
          testable: true
          tests:
            - "Verify access authorization"
            - "Verify access establishment"
            - "Verify access modification"
          evidence:
            - "Access control procedures"
            - "Access logs"

        - id: "hipaa-164-308-a-4"
          title: "Security awareness and training"
          testable: true
          tests:
            - "Verify training program"
            - "Verify periodic updates"
            - "Verify phishing simulations"
          evidence:
            - "Training materials"
            - "Completion records"
            - "Phishing results"

        - id: "hipaa-164-308-a-5"
          title: "Security incident procedures"
          testable: true
          tests:
            - "Verify incident response plan"
            - "Verify breach notification"
            - "Verify documentation"
          evidence:
            - "Incident response plan"
            - "Incident logs"
            - "Notification records"

        - id: "hipaa-164-308-a-6"
          title: "Contingency plan"
          testable: true
          tests:
            - "Verify data backup"
            - "Verify disaster recovery"
            - "Verify emergency mode"
            - "Verify testing"
          evidence:
            - "Backup procedures"
            - "DR plan"
            - "Test results"

        - id: "hipaa-164-308-a-7"
          title: "Evaluation"
          testable: true
          tests:
            - "Verify periodic evaluation"
            - "Verify environmental changes assessed"
          evidence:
            - "Evaluation reports"
            - "Change assessments"

        - id: "hipaa-164-308-b-1"
          title: "Business associate agreements"
          testable: true
          tests:
            - "Verify BAA with all BAs"
            - "Verify BAA terms"
          evidence:
            - "BAA contracts"
            - "BA inventory"

      physical:
        - id: "hipaa-164-310-a-1"
          title: "Facility access controls"
          testable: true
          tests:
            - "Verify physical access controls"
            - "Verify visitor procedures"
          evidence:
            - "Access control systems"
            - "Visitor logs"

        - id: "hipaa-164-310-a-2"
          title: "Workstation use"
          testable: true
          tests:
            - "Verify workstation restrictions"
            - "Verify screen privacy"
          evidence:
            - "Workstation policies"
            - "Configuration audits"

        - id: "hipaa-164-310-a-3"
          title: "Workstation security"
          testable: true
          tests:
            - "Verify device encryption"
            - "Verify auto-lock"
          evidence:
            - "Encryption verification"
            - "Configuration audits"

        - id: "hipaa-164-310-b"
          title: "Device and media controls"
          testable: true
          tests:
            - "Verify disposal procedures"
            - "Verify media re-use"
            - "Verify accountability"
          evidence:
            - "Disposal certificates"
            - "Media logs"
            - "Accountability records"

      technical:
        - id: "hipaa-164-312-a-1"
          title: "Access control"
          testable: true
          tests:
            - "Verify unique user IDs"
            - "Verify emergency access"
            - "Verify automatic logoff"
            - "Verify encryption/decryption"
          evidence:
            - "User provisioning"
            - "Emergency access procedures"
            - "Timeout configs"
            - "Encryption implementation"

        - id: "hipaa-164-312-b"
          title: "Audit controls"
          testable: true
          tests:
            - "Verify audit logging"
            - "Verify log integrity"
            - "Verify log review"
          evidence:
            - "Audit log samples"
            - "Integrity controls"
            - "Review procedures"

        - id: "hipaa-164-312-c-1"
          title: "Integrity"
          testable: true
          tests:
            - "Verify PHI integrity controls"
            - "Verify electronic signatures"
          evidence:
            - "Integrity controls"
            - "Signature implementation"

        - id: "hipaa-164-312-d"
          title: "Person or entity authentication"
          testable: true
          tests:
            - "Verify authentication mechanisms"
            - "Verify MFA"
          evidence:
            - "Auth configurations"
            - "MFA enforcement"

        - id: "hipaa-164-312-e-1"
          title: "Transmission security"
          testable: true
          tests:
            - "Verify encryption in transit"
            - "Verify integrity controls"
          evidence:
            - "TLS configurations"
            - "VPN configurations"
            - "Integrity verification"

  evidencePackage:
    required:
      - "Privacy policies and procedures"
      - "Security policies and procedures"
      - "Risk analysis documentation"
      - "BAA contracts"
      - "Training records"
      - "Incident response plan and logs"
      - "Contingency plan and test results"
      - "Access control procedures and logs"
      - "Audit log samples"
      - "Encryption implementation evidence"
      - "Physical security documentation"
      - "Device/media control procedures"
      - "Business associate inventory"
      - "Sanctions policy"
      - "Complaint procedures"

# PCI DSS Compliance (Payment Card Industry Data Security Standard)
pci_dss:
  enabled: true
  description: "Payment Card Industry Data Security Standard v4.0"
  requirements:
    - id: "pci-1"
      title: "Install and maintain network security controls"
      testable: true
      tests:
        - "Verify firewall configuration"
        - "Verify network segmentation"
        - "Verify DMZ implementation"
      evidence:
        - "Firewall rule reviews"
        - "Network diagrams"
        - "Segmentation evidence"

    - id: "pci-2"
      title: "Apply secure configurations to all system components"
      testable: true
      tests:
        - "Verify default passwords changed"
        - "Verify unnecessary services disabled"
        - "Verify secure configs documented"
      evidence:
        - "Config baselines"
        - "Hardening guides"
        - "Change management logs"

    - id: "pci-3"
      title: "Protect stored account data"
      testable: true
      tests:
        - "Verify PAN protection (encryption, truncation, hashing)"
        - "Verify key management"
        - "Verify SAD not stored post-auth"
      evidence:
        - "Encryption implementation"
        - "Key management procedures"
        - "Tokenization evidence"
        - "SAD destruction logs"

    - id: "pci-4"
      title: "Protect cardholder data with strong cryptography during transmission"
      testable: true
      tests:
        - "Verify TLS 1.2+ for all transmissions"
        - "Verify PAN encryption over open networks"
        - "Verify key strength"
      evidence:
        - "TLS configurations"
        - "Certificate details"
        - "Cipher suite lists"

    - id: "pci-5"
      title: "Protect all systems and networks from malicious software"
      testable: true
      tests:
        - "Verify anti-malware deployed"
        - "Verify automatic updates"
        - "Verify periodic scans"
      evidence:
        - "Anti-malware deployment"
        - "Update logs"
        - "Scan reports"

    - id: "pci-6"
      title: "Develop and maintain secure systems and software"
      testable: true
      tests:
        - "Verify secure development lifecycle"
        - "Verify vulnerability management"
        - "Verify code reviews"
        - "Verify WAF for public apps"
      evidence:
        - "SDL documentation"
        - "Vulnerability scan reports"
        - "Code review records"
        - "WAF configurations"

    - id: "pci-7"
      title: "Restrict access to system components and cardholder data"
      testable: true
      tests:
        - "Verify need-to-know access"
        - "Verify unique IDs"
        - "Verify MFA for all access"
        - "Verify privileged access controls"
      evidence:
        - "Access control matrix"
        - "MFA enforcement"
        - "Privileged access procedures"

    - id: "pci-8"
      title: "Identify users and authenticate access to system components"
      testable: true
      tests:
        - "Verify unique IDs"
        - "Verify MFA for all remote access"
        - "Verify MFA for all admin access"
        - "Verify password requirements"
      evidence:
        - "User provisioning procedures"
        - "MFA configurations"
        - "Password policies"

    - id: "pci-9"
      title: "Restrict physical access to cardholder data"
      testable: true
      tests:
        - "Verify physical access controls"
        - "Verify media protection"
        - "Verify visitor procedures"
      evidence:
        - "Access control systems"
        - "Media handling procedures"
        - "Visitor logs"

    - id: "pci-10"
      title: "Log and monitor all access to system components and cardholder data"
      testable: true
      tests:
        - "Verify audit trails"
        - "Verify log protection"
        - "Verify log retention (1 year)"
        - "Verify log review"
        - "Verify time synchronization"
      evidence:
        - "Log samples"
        - "Log protection configs"
        - "Retention policies"
        - "Review procedures"
        - "NTP configurations"

    - id: "pci-11"
      title: "Test security of systems and networks regularly"
      testable: true
      tests:
        - "Verify quarterly internal scans"
        - "Verify quarterly external scans"
        - "Verify annual penetration test"
        - "Verify segmentation testing"
        - "Verify intrusion detection"
        - "Verify change detection"
      evidence:
        - "Scan reports"
        - "Penetration test reports"
        - "Segmentation test results"
        - "IDS/IPS configurations"
        - "FIM reports"

    - id: "pci-12"
      title: "Support information security with organizational policies and programs"
      testable: true
      tests:
        - "Verify security policy"
        - "Verify risk assessment (annual)"
        - "Verify security awareness program"
        - "Verify incident response plan"
        - "Verify service provider management"
      evidence:
        - "Security policy"
        - "Risk assessment reports"
        - "Training records"
        - "Incident response plan"
        - "Vendor assessments"

  evidencePackage:
    required:
      - "ROI (Report on Compliance) or SAQ"
      - "Network diagrams with CDE"
      - "Data flow diagrams"
      - "Firewall/router configs"
      - "System configurations"
      - "Encryption implementations"
      - "Key management documentation"
      - "Anti-malware deployment"
      - "Vulnerability scan reports"
      - "Penetration test reports"
      - "Access control lists"
      - "MFA configurations"
      - "Physical security documentation"
      - "Audit log configurations"
      - "Log review procedures"
      - "Security policies"
      - "Risk assessments"
      - "Training records"
      - "Incident response plan"
      - "Vendor assessments"
      - "Compensating controls (if any)"

# SOX Compliance (Sarbanes-Oxley Act)
sox:
  enabled: true
  description: "Sarbanes-Oxley Act Section 404"
  controls:
    - id: "sox-change-management"
      title: "Change Management Controls"
      testable: true
      tests:
        - "Verify change approval process"
        - "Verify segregation of duties"
        - "Verify emergency change process"
        - "Verify rollback procedures"
      evidence:
        - "Change approval records"
        - "Segregation of duties matrix"
        - "Emergency change logs"
        - "Rollback test results"

    - id: "sox-access-control"
      title: "Access Controls"
      testable: true
      tests:
        - "Verify user provisioning/deprovisioning"
        - "Verify periodic access reviews"
        - "Verify privileged access monitoring"
        - "Verify segregation of duties"
      evidence:
        - "Provisioning procedures"
        - "Access review records"
        - "Privileged access logs"
        - "SOD matrix"

    - id: "sox-data-integrity"
      title: "Data Integrity"
      testable: true
      tests:
        - "Verify data validation controls"
        - "Verify reconciliation procedures"
        - "Verify audit trails"
        - "Verify backup and recovery"
      evidence:
        - "Validation rules"
        - "Reconciliation reports"
        - "Audit trail samples"
        - "Backup test results"

    - id: "sox-computer-operations"
      title: "Computer Operations"
      testable: true
      tests:
        - "Verify job scheduling controls"
        - "Verify error handling"
        - "Verify system monitoring"
        - "Verify problem management"
      evidence:
        - "Job schedules"
        - "Error logs"
        - "Monitoring dashboards"
        - "Problem tickets"

    - id: "sox-program-development"
      title: "Program Development"
      testable: true
      tests:
        - "Verify SDLC controls"
        - "Verify testing procedures"
        - "Verify migration controls"
        - "Verify documentation"
      evidence:
        - "SDLC documentation"
        - "Test plans/results"
        - "Migration approvals"
        - "System documentation"

  evidencePackage:
    required:
      - "ICFR (Internal Control over Financial Reporting) documentation"
      - "Control narratives"
      - "Risk assessment"
      - "Control testing results"
      - "Deficiency remediation"
      - "Management assertion"
      - "Auditor attestation"

# ISO 27001 Compliance
iso27001:
  enabled: true
  description: "ISO/IEC 27001:2022 Information Security Management"
  clauses:
    - clause: "4"
      title: "Context of the organization"
      requirements:
        - "4.1 Understanding the organization"
        - "4.2 Understanding interested parties"
        - "4.3 Scope of ISMS"
        - "4.4 ISMS establishment"

    - clause: "5"
      title: "Leadership"
      requirements:
        - "5.1 Leadership and commitment"
        - "5.2 Information security policy"
        - "5.3 Organizational roles"

    - clause: "6"
      title: "Planning"
      requirements:
        - "6.1 Risk assessment"
        - "6.2 Risk treatment"
        - "6.3 Objectives"

    - clause: "7"
      title: "Support"
      requirements:
        - "7.1 Resources"
        - "7.2 Competence"
        - "7.3 Awareness"
        - "7.4 Communication"
        - "7.5 Documented information"

    - clause: "8"
      title: "Operation"
      requirements:
        - "8.1 Operational planning"
        - "8.2 Risk assessment"
        - "8.3 Risk treatment"

    - clause: "9"
      title: "Performance evaluation"
      requirements:
        - "9.1 Monitoring, measurement, analysis"
        - "9.2 Internal audit"
        - "9.3 Management review"

    - clause: "10"
      title: "Improvement"
      requirements:
        - "10.1 Nonconformity and corrective action"
        - "10.2 Continual improvement"

    - annex: "A"
      title: "Reference control objectives and controls"
      controls:
        - "A.5 Information security policies"
        - "A.6 Organization of information security"
        - "A.7 Human resource security"
        - "A.8 Asset management"
        - "A.9 Access control"
        - "A.10 Cryptography"
