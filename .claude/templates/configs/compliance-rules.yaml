# Audit Evidence Packaging
auditPackaging:
  structure:
    - "index.html"
    - "control-mapping.csv"
    - "executive-summary.pdf"
    - "evidence/"
      - "policies/"
      - "procedures/"
      - "logs/"
      - "configs/"
      - "test-results/"
      - "contracts/"
      - "training/"
      - "incidents/"
    - "checksums.sha256"
    - "reader-guide.md"

  namingConvention: "audit-{framework}-{period}-{timestamp}.zip"

  metadata:
    include:
      - "framework"
      - "version"
      - "period"
      - "generatedAt"
      - "generatedBy"
      - "scope"
      - "exclusions"
      - "controlCount"
      - "evidenceCount"

# Compliance Testing Automation
automation:
  enabled: true
  schedule: "0 3 * * 1"  # Weekly Monday 3 AM
  workflows:
    - framework: "gdpr"
      workflow: "compliance-gdpr"
    - framework: "hipaa"
      workflow: "compliance-hipaa"
    - framework: "pci_dss"
      workflow: "compliance-pci"
    - framework: "sox"
      workflow: "compliance-sox"
    - framework: "iso27001"
      workflow: "compliance-iso"
    - framework: "soc2"
      workflow: "compliance-soc2"

  notifications:
    onFailure:
      - slack: "#compliance-alerts"
      - email: "compliance@company.com"
    onSuccess:
      - slack: "#compliance-reports"
    onEvidenceReady:
      - email: "auditors@company.com"