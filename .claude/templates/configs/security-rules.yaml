# Security Rules Configuration
# Used by sdet-security, sdet-deploy, sdet-governance
# Place at: templates/configs/security-rules.yaml

version: "1.0"
description: "Security testing rules, thresholds, and compliance mappings"

# SAST Rules (Static Application Security Testing)
sast:
  enabled: true
  tools:
    - name: "semgrep"
      config: "auto"  # auto, p/security-audit, p/secrets, p/owasp-top-ten
      rulesets:
        - "p/security-audit"
        - "p/secrets"
        - "p/owasp-top-ten"
        - "p/cwe-top-25"
      customRules: "rules/semgrep/custom/"
      exclude:
        - "**/node_modules/**"
        - "**/.git/**"
        - "**/dist/**"
        - "**/build/**"
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "**/mocks/**"
        - "**/fixtures/**"
      severityMapping:
        ERROR: "critical"
        WARNING: "high"
        INFO: "medium"

    - name: "codeql"
      queries:
        - "security-extended"
        - "security-and-quality"
      packs:
        - "codeql/javascript-queries"
        - "codeql/typescript-queries"
        - "codeql/python-queries"
        - "codeql/java-queries"
        - "codeql/go-queries"
      exclude:
        - "**/node_modules/**"
        - "**/test/**"
        - "**/*.test.ts"

    - name: "sonarqube"
      qualityGate: "Security"
      rules:
        - "javascript:S2068"  # Hardcoded credentials
        - "javascript:S2076"  # Hardcoded cryptographic key
        - "javascript:S4426"  # Weak crypto algorithm
        - "javascript:S5131"  # Weak hash algorithm
        - "javascript:S5144"  # Weak random generator
        - "javascript:S5167"  # SQL injection
        - "javascript:S3649"  # Path traversal

  categories:
    - id: "injection"
      name: "Injection"
      cwe: ["CWE-79", "CWE-89", "CWE-564", "CWE-94", "CWE-95", "CWE-96", "CWE-97", "CWE-98", "CWE-99"]
      owasp: "A03:2021"
      severity: "critical"

    - id: "broken-auth"
      name: "Broken Authentication"
      cwe: ["CWE-287", "CWE-288", "CWE-289", "CWE-290", "CWE-294", "CWE-302", "CWE-304", "CWE-306", "CWE-307", "CWE-308", "CWE-309", "CWE-310", "CWE-311", "CWE-312", "CWE-319", "CWE-320", "CWE-321", "CWE-322", "CWE-323", "CWE-324", "CWE-325", "CWE-326", "CWE-327", "CWE-328", "CWE-329", "CWE-330", "CWE-331", "CWE-332", "CWE-333", "CWE-334", "CWE-335", "CWE-336", "CWE-337", "CWE-338", "CWE-339", "CWE-340", "CWE-341", "CWE-342", "CWE-343", "CWE-344", "CWE-345", "CWE-346", "CWE-347", "CWE-348", "CWE-349", "CWE-350", "CWE-351", "CWE-352", "CWE-353", "CWE-354", "CWE-355", "CWE-356", "CWE-357", "CWE-358", "CWE-359", "CWE-360", "CWE-361", "CWE-362", "CWE-363", "CWE-364", "CWE-365", "CWE-366", "CWE-367", "CWE-368", "CWE-369", "CWE-370", "CWE-371", "CWE-372", "CWE-373", "CWE-374", "CWE-375", "CWE-376", "CWE-377", "CWE-378", "CWE-379", "CWE-380", "CWE-381", "CWE-382", "CWE-383", "CWE-384", "CWE-385", "CWE-386", "CWE-387", "CWE-388", "CWE-389", "CWE-390", "CWE-391", "CWE-392", "CWE-393", "CWE-394", "CWE-395", "CWE-396", "CWE-397", "CWE-398", "CWE-399", "CWE-400"]
      owasp: "A07:2021"
      severity: "critical"

    - id: "sensitive-data"
      name: "Sensitive Data Exposure"
      cwe: ["CWE-200", "CWE-201", "CWE-209", "CWE-311", "CWE-312", "CWE-313", "CWE-319", "CWE-321", "CWE-322", "CWE-323", "CWE-324", "CWE-325", "CWE-326", "CWE-327", "CWE-328", "CWE-329", "CWE-330", "CWE-331", "CWE-332", "CWE-333", "CWE-334", "CWE-335", "CWE-336", "CWE-337", "CWE-338", "CWE-339", "CWE-340", "CWE-341", "CWE-342", "CWE-343", "CWE-344", "CWE-345", "CWE-346", "CWE-347", "CWE-348", "CWE-349", "CWE-350"]
      owasp: "A02:2021"
